[package]
name = "oxty"
description = "A terminal emulator engine in Rust: parse VT bytes, keep the screen, hand any renderer the rows that changed. Runs natively and in WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["terminal", "vt100", "xterm", "wasm", "emulator"]
categories = ["command-line-interface", "wasm"]

[dependencies]
alacritty_terminal = { path = "../../vendor/alacritty_terminal", version = "=0.26.0", default-features = false }
