[package]
name = "oxtty-web"
description = "The browser front end of oxtty: an xterm.js-compatible terminal written in Rust, drawn with WebGL2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND MIT"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

# Pinned exactly: the wasm-bindgen CLI that generates the glue must be the same version (scripts/build-web.sh checks).
[dependencies]
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"

# One feature per line, sorted: modules add the ones they use.
[dependencies.web-sys]
version = "=0.3.106"
features = [
    "CanvasGradient",
    "CanvasPattern",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "FontFaceSet",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlStyleElement",
    "ImageData",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "MouseEvent",
    "Navigator",
    "Node",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "Path2d",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverOptions",
    "TextMetrics",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlContextAttributes",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "WebglLoseContext",
    "Window",
    "console",
]
