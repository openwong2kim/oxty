[workspace]
resolver = "2"
members = ["crates/oxtty", "crates/oxtty-wasm", "crates/oxtty-node", "crates/oxtty-web"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/openwong2kim/oxtty"
authors = ["openwong2kim"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Abort-on-panic build for the browser package. opt-level 3 over "s":
# parsing 10–18% faster for 3 KB more gzip.
[profile.wasm]
inherits = "release"
panic = "abort"
strip = true
