name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p oxty -p oxty-wasm -p oxty-node --check  # never reformat vendor/
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p oxty

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-wasm.sh
      - run: npm test
        working-directory: packages/oxty

  node-binding:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-node.sh
        shell: bash
      - run: node --test crates/oxty-node/test.cjs
