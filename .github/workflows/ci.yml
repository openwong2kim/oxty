name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p oxtty -p oxtty-wasm -p oxtty-node --check  # src/vt is #[rustfmt::skip]
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p oxtty

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-wasm.sh
      - run: npm ci
        working-directory: packages/oxtty
      - run: npm test
        working-directory: packages/oxtty
      - run: npm run typecheck:xterm
        working-directory: packages/oxtty
      - run: npm run test:xterm
        working-directory: packages/oxtty

  node-binding:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-node.sh
        shell: bash
      - run: node --test crates/oxtty-node/test.cjs
